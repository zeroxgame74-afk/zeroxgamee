<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEROX</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

:root{
    --main:#B61C1C;
}

body{
    margin:0;
    font-family:'Vazirmatn', sans-serif;
    background:#0a0a0a;
    color:white;
}

/* لوگو */
.logo{
    display:flex;
    justify-content:center;
    padding:20px;
}

.logo img{
    width:780px;
    max-width:95%;
    height:auto;
    /* بدون نور طبق خواسته */
    filter:none;
}

/* منو شیشه‌ای */
nav{
    display:flex;
    justify-content:center;
    gap:15px;
    margin:10px auto;
    padding:12px;
    width:90%;
    
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:15px;
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
}

/* آیتم‌های منو */
nav a{
    color:white;
    text-decoration:none;
    padding:10px 14px;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition:0.3s;
}

nav a i{
    color:var(--main);
}

nav a:hover{
    background:var(--main);
}

/* بخش‌ها */
.section{
    display:none;
    padding:20px;
}

.active{
    display:block;
}

/* کارت خبر */
.card{
    background:#141414;
    border:1px solid var(--main);
    border-radius:12px;
    padding:15px;
}

.card h2{
    color:var(--main);
    font-weight:900;
}

button{
    background:var(--main);
    border:none;
    padding:8px 12px;
    color:white;
    border-radius:8px;
    cursor:pointer;
    font-weight:700;
}

.more{
    display:none;
    margin-top:10px;
    color:#ccc;
}

/* فوتر */
footer{
    text-align:center;
    padding:15px;
    background:#111;
    color:#aaa;
    margin-top:20px;
}

</style>

</head>

<body>

<!-- لوگو -->
<div class="logo">
    <img src="https://uploadkon.ir/uploads/3ee908_26Zerox.png">
</div>

<!-- منو شیشه‌ای -->
<nav>
<a onclick="showTab('home')"><i class="fa-solid fa-house"></i> خانه</a>
<a onclick="showTab('news')"><i class="fa-solid fa-gamepad"></i> اخبار</a>
<a onclick="showTab('shop')"><i class="fa-solid fa-shop"></i> شاپ</a>
<a onclick="showTab('video')"><i class="fa-solid fa-video"></i> ویدیوها</a>
<a onclick="showTab('story')"><i class="fa-solid fa-book"></i> داستان‌ها</a>
</nav>

<!-- خانه -->
<div id="home" class="section active">
    <h2>به ZEROX خوش اومدی 🔥</h2>
</div>

<!-- اخبار -->
<div id="news" class="section">

    <div class="card">
        <h2>GTA VI خبر جدید</h2>
        <p>جدیدترین اطلاعات GTA 6 منتشر شد.</p>

        <button onclick="toggle(this)">توضیحات بیشتر</button>

        <div class="more">
            GTA 6 دارای بزرگ‌ترین نقشه سری GTA است و AI بسیار پیشرفته دارد.
        </div>
    </div>

</div>

<!-- شاپ -->
<div id="shop" class="section">
    <h2>زروکس شاپ به زودی</h2>
</div>

<!-- ویدیو -->
<div id="video" class="section">
    <h2>ویدیوها</h2>
</div>

<!-- داستان -->
<div id="story" class="section">
    <h2>داستان‌ها</h2>
</div>

<footer>
© 2026 ZEROX | دنیای گیمینگ
</footer>

<script>

function showTab(id){
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function toggle(btn){
    let more = btn.nextElementSibling;
    more.style.display = more.style.display === "block" ? "none" : "block";
}

</script>

</body>
</html>
