<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEROX</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;600;800&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Vazirmatn', sans-serif;
    background:#0a0a0a;
    color:white;
}

/* هدر */
header{
    background:#B61C1C;
    padding:18px;
    text-align:center;
    font-size:30px;
    font-weight:800;
    letter-spacing:2px;
    box-shadow:0 0 15px #B61C1C;
}

/* منو */
nav{
    display:flex;
    justify-content:center;
    gap:25px;
    background:#111;
    padding:12px;
    flex-wrap:wrap;
}

nav a{
    color:white;
    text-decoration:none;
    padding:10px 14px;
    border-radius:10px;
    transition:0.3s;
    display:flex;
    align-items:center;
    gap:6px;
    font-weight:500;
}

nav a:hover{
    background:#B61C1C;
    box-shadow:0 0 10px #B61C1C;
}

/* آیکون‌ها */
.icon{
    width:18px;
    height:18px;
}

/* محتوا */
.container{
    padding:25px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}

/* کارت */
.card{
    background:#141414;
    border:1px solid #B61C1C;
    border-radius:12px;
    padding:15px;
    transition:0.3s;
}
.card:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px #B61C1C;
}

.card h2{
    color:#ff3b3b;
}

/* فوتر */
footer{
    text-align:center;
    padding:15px;
    background:#111;
    color:#aaa;
    margin-top:20px;
    font-size:13px;
}
</style>

</head>

<body>

<header>ZEROX</header>

<nav>

<a href="#">
<svg class="icon" viewBox="0 0 24 24" fill="white"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z"/></svg>
اخبار گیم
</a>

<a href="#">
<svg class="icon" viewBox="0 0 24 24" fill="white"><path d="M3 7h18v13H3z"/><path d="M7 7V5h10v2"/></svg>
زروکس شاپ
</a>

<a href="#">
<svg class="icon" viewBox="0 0 24 24" fill="white"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4z"/></svg>
ویدیوها
</a>

<a href="#">
<svg class="icon" viewBox="0 0 24 24" fill="white"><path d="M4 20h16v-2H4z"/><path d="M6 18V6h12v12"/></svg>
داستان‌ها
</a>

</nav>

<div class="container">

<div class="card">
<h2>GTA VI</h2>
<p>آخرین اخبار GTA 6 داغ شده! نقشه بزرگ‌تر و گرافیک فوق‌واقعی در راه است.</p>
</div>

<div class="card">
<h2>Call of Duty</h2>
<p>آپدیت جدید COD با مودهای جدید و سلاح‌های حرفه‌ای منتشر شد.</p>
</div>

</div>

<footer>
© 2026 ZEROX | دنیای گیمینگ و اخبار
</footer>

</body>
</html>
