<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEROX</title>

<!-- فونت وزیرمتن -->
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;300;400;600;800&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Vazirmatn', sans-serif;
    background:#0a0a0a;
    color:white;
}

/* هدر */
header{
    background:#B61C1C;
    padding:18px;
    text-align:center;
    font-size:30px;
    font-weight:800;
    letter-spacing:2px;
    box-shadow:0 0 15px #B61C1C;
}

/* محتوا */
.container{
    padding:25px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:20px;
}

/* کارت خبر */
.card{
    background:#141414;
    border:1px solid #B61C1C;
    border-radius:12px;
    padding:15px;
    transition:0.3s;
}
.card:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px #B61C1C;
}

.card h2{
    color:#ff3b3b;
}

/* فوتر */
footer{
    text-align:center;
    padding:15px;
    background:#111;
    color:#aaa;
    margin-top:20px;
    font-size:13px;
}
</style>

</head>

<body>

<header>ZEROX</header>

<div class="container">

<div class="card">
<h2>GTA VI</h2>
<p>
آخرین اخبار GTA 6 داغ شده! نقشه بزرگ‌تر، گرافیک قوی‌تر و داستانی کاملاً جدید در راه است.
</p>
</div>

<div class="card">
<h2>Call of Duty</h2>
<p>
آپدیت جدید Call of Duty منتشر شد! مودهای جدید و سلاح‌های حرفه‌ای اضافه شده‌اند.
</p>
</div>

</div>

<footer>
© 2026 ZEROX | ساخته شده برای دنیای گیمینگ
</footer>

</body>
</html>
