<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEROX | GAME HUB</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
    --main:#B61C1C;
}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    font-family:'Vazirmatn', sans-serif;
    background:var(--main);
    color:white;
}

/* هدر - منو چسبیده به لوگو */
.header{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0px;
    padding-top:8px;
}

/* لوگو - بزرگتر و وسط */
.logo{
    text-align:center;
    width:100%;
}
.logo img{
    width:1100px;
    max-width:95%;
    display:block;
    margin:0 auto;
    margin-bottom:-5px;
}

/* منو - چسبیده به لوگو */
nav{
    width:94%;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    padding:10px 10px 12px 10px;
    border:1px solid rgba(255,255,255,0.3);
    border-radius:20px;
    background:transparent;
    margin-top:0px;
}
nav a{
    color:white;
    text-decoration:none;
    padding:8px 14px;
    border-radius:10px;
    font-weight:800;
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    transition:0.2s;
    font-size:14px;
}
nav a i{
    color:var(--main);
    background:white;
    padding:5px;
    border-radius:50%;
    font-size:12px;
}
nav a:hover{
    background:white;
    color:var(--main);
}

/* بخش‌ها */
.section{
    display:none;
    padding:20px;
}
.section.active{
    display:block;
}

/* فیلترها */
.filter-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:30px;
    justify-content:center;
}
.filter-btn{
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.3);
    padding:10px 22px;
    border-radius:50px;
    color:white;
    cursor:pointer;
    transition:0.2s;
    font-family:'Vazirmatn',sans-serif;
    font-weight:800;
    font-size:14px;
    display:inline-flex;
    align-items:center;
    gap:8px;
}
.filter-btn i{font-size:14px;}
.filter-btn:hover{
    background:var(--main);
    border-color:var(--main);
    transform:translateY(-2px);
}
.filter-btn.active{
    background:var(--main);
    border-color:var(--main);
    box-shadow:0 0 12px rgba(182,28,28,0.5);
}

/* کارت حرفه‌ای */
.hybrid-card{
    background:white;
    border-radius:24px;
    margin-top:25px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
    transition:transform 0.2s, box-shadow 0.2s;
}
.hybrid-card:hover{
    transform:translateY(-6px);
    box-shadow:0 20px 30px -8px rgba(0,0,0,0.3);
}
.hybrid-inner{
    display:flex;
    flex-direction:column;
}
@media (min-width:700px){
    .hybrid-inner{flex-direction:row;}
}
.hybrid-media{
    flex:1.2;
    background:#111;
}
.hybrid-media img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    min-height:220px;
}
.hybrid-content{
    flex:1.5;
    padding:24px;
    color:#1a1a1a;
}
.hybrid-badge{
    display:inline-block;
    background:var(--main);
    color:white;
    padding:5px 16px;
    border-radius:40px;
    font-size:12px;
    font-weight:700;
    margin-bottom:14px;
}
.hybrid-badge i{margin-left:6px;}
.hybrid-content h2{
    font-size:1.8rem;
    margin-bottom:10px;
    color:#000;
    font-weight:900;
}
.hybrid-desc{
    opacity:0.8;
    margin-bottom:18px;
    line-height:1.6;
    color:#2c2c3a;
    font-weight:500;
}
.news-actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:8px;
}
.news-actions button{
    background:var(--main);
    color:white;
    border:none;
    padding:9px 20px;
    border-radius:40px;
    cursor:pointer;
    font-weight:800;
    font-family:inherit;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:0.2s;
}
.news-actions button i{font-size:14px;}
.news-actions button:hover{
    background:#8e1515;
    transform:scale(0.97);
}
.news-full-text{
    display:none;
    margin-top:18px;
    padding:16px;
    background:#f5f5f5;
    border-radius:16px;
    color:#1a1a1a;
    line-height:1.8;
    font-size:14px;
    border-right:3px solid var(--main);
}

/* ========== کارت ویدیو ========== */
.videos-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:25px;
    margin-bottom:40px;
}
@media (max-width:700px){
    .videos-grid{
        grid-template-columns:1fr;
    }
}

.video-card{
    background:white;
    border-radius:24px;
    overflow:hidden;
    transition:0.3s ease;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    position:relative;
    display:flex;
    flex-direction:column;
}
.video-card:hover{
    transform:translateY(-8px);
    box-shadow:0 20px 30px -8px rgba(0,0,0,0.3);
}
.video-thumb{
    width:100%;
    height:200px;
    object-fit:cover;
    display:block;
}
.video-badge{
    position:absolute;
    top:15px;
    right:15px;
    background:var(--main);
    color:white;
    padding:5px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:900;
    display:flex;
    align-items:center;
    gap:5px;
}
.video-info{
    padding:20px;
    text-align:center;
    flex:1;
    display:flex;
    flex-direction:column;
}
.video-info h3{
    font-size:1.3rem;
    margin-bottom:10px;
    font-weight:900;
    color:var(--main);
}
.video-meta-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:12px;
}
.video-cat-tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#f0f0f0;
    padding:4px 12px;
    border-radius:30px;
    font-size:11px;
    color:var(--main);
    font-weight:800;
}
.date-time{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:11px;
    color:#666;
    font-weight:500;
}
.date-time i{
    color:var(--main);
    font-size:11px;
}
.video-info p{
    font-size:0.85rem;
    color:#444;
    margin-bottom:15px;
    line-height:1.5;
    font-weight:500;
}
.button-group{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-top:5px;
}
/* انیمیشن نور برای دکمه‌های ویدیو */
@keyframes shine {
    0% { left: -100%; }
    20% { left: 100%; }
    100% { left: 100%; }
}
.btn-card, .more-btn{
    position:relative;
    overflow:hidden;
}
.btn-card::after, .more-btn::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 80%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    animation: shine 3s infinite;
}
.btn-card:hover::after, .more-btn:hover::after {
    animation: none;
}
.btn-card{
    background:var(--main);
    border:none;
    padding:8px 18px;
    border-radius:40px;
    color:white;
    font-weight:800;
    cursor:pointer;
    transition:0.2s;
    font-size:13px;
    font-family:'Vazirmatn',sans-serif;
    display:inline-flex;
    align-items:center;
    gap:8px;
}
.btn-card:hover{
    background:#8a1010;
    transform:scale(1.02);
}
.more-btn{
    background:transparent;
    border:1px solid var(--main);
    padding:8px 18px;
    border-radius:40px;
    color:var(--main);
    font-size:13px;
    cursor:pointer;
    font-family:'Vazirmatn',sans-serif;
    font-weight:800;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:0.2s;
}
.more-btn:hover{
    background:var(--main);
    color:white;
}
.full-text{
    display:none;
    margin-top:15px;
    padding:14px;
    background:#f5f5f5;
    border-radius:16px;
    text-align:right;
    font-size:13px;
    color:#1a1a1a;
    line-height:1.8;
    border-right:3px solid var(--main);
}

/* ========== کارت موسیقی ========== */
.music-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:30px;
    margin-bottom:40px;
}
.music-card{
    background:white;
    border-radius:28px;
    overflow:hidden;
    transition:0.3s ease;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}
.music-card:hover{
    transform:translateY(-8px);
    box-shadow:0 25px 35px -12px rgba(0,0,0,0.3);
}
.music-img{
    width:100%;
    height:auto;
    aspect-ratio:1/1;
    object-fit:cover;
    transition:0.3s;
}
.music-card:hover .music-img{
    transform:scale(1.02);
}
.music-info{
    padding:22px;
    text-align:center;
}
.music-info h3{
    font-size:1.4rem;
    margin-bottom:6px;
    font-weight:900;
    color:var(--main);
}
.platform-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#f0f0f0;
    padding:6px 16px;
    border-radius:40px;
    font-size:12px;
    color:var(--main);
    font-weight:800;
    margin-bottom:15px;
}
.composers-box{
    background:#f9f9f9;
    border-radius:20px;
    padding:12px 15px;
    margin:12px 0;
    text-align:right;
    border-right:3px solid var(--main);
}
.composers-box .composer-title{
    font-size:12px;
    font-weight:800;
    color:var(--main);
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:6px;
}
.composer-names{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
}
.composer-name{
    background:white;
    border-radius:30px;
    padding:4px 12px;
    font-size:11px;
    color:#333;
    font-weight:600;
    border:1px solid #eee;
}
.music-desc{
    font-size:13px;
    color:#555;
    margin:12px 0;
    line-height:1.6;
}
.custom-player{
    background:#f8f8f8;
    border-radius:60px;
    padding:10px 18px;
    margin-top:12px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
    border:1px solid #eee;
    transition:0.2s;
    position:relative;
    overflow:hidden;
}
.custom-player:hover{
    border-color:var(--main);
    background:#fff;
}
.custom-player audio{
    flex:1;
    min-width:160px;
    height:40px;
    border-radius:40px;
    outline:none;
}
.download-music-btn{
    background:var(--main);
    color:white;
    border:none;
    padding:8px 18px;
    border-radius:40px;
    cursor:pointer;
    font-family:'Vazirmatn',sans-serif;
    font-weight:800;
    font-size:12px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:0.2s;
    text-decoration:none;
    position:relative;
    overflow:hidden;
}
.download-music-btn::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 80%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    animation: shine 3s infinite;
}
.download-music-btn:hover{
    background:#8a1010;
    transform:scale(1.03);
}
.download-music-btn:hover::after {
    animation: none;
}

/* گرید اخبار و داستان‌ها */
.news-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
    gap:30px;
    margin-bottom:40px;
}
.cards-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
    gap:30px;
    margin-bottom:40px;
}
.section-title{
    font-size:1.8rem;
    font-weight:900;
    margin:30px 0 20px 0;
    border-right:4px solid white;
    padding-right:15px;
    display:flex;
    align-items:center;
    gap:12px;
    color:white;
}
.section-title i{
    font-size:28px;
}
footer{
    text-align:center;
    padding:15px;
    color:white;
    margin-top:40px;
    border-top:1px solid rgba(255,255,255,0.4);
    font-size:13px;
}
</style>
</head>

<div class="header">
    <div class="logo">
        <img src="https://uploadkon.ir/uploads/3ee908_26Zerox.png" alt="ZEROX">

        <a onclick="showTab('video')"><i class="fa-solid fa-video"></i> ویدیوها</a>
        <a onclick="showTab('music')"><i class="fa-solid fa-music"></i> موسیقی</a>
        <a onclick="showTab('shop')"><i class="fa-solid fa-shop"></i> شاپ</a>

<!-- صفحه خانه -->
<div id="home" class="section active">
    <div class="section-title"><i class="fa-solid fa-fire"></i> آخرین ویدیوها</div>
    <div id="homeVideosGrid" class="videos-grid"></div>
    
    <div class="section-title"><i class="fa-regular fa-newspaper"></i> آخرین اخبار</div>

<!-- اخبار (فقط ولورین) -->
<div id="news" class="section">

</div>

<!-- ویدیوها -->
<div id="video" class="section">

    <div id="videosGrid" class="videos-grid"></div>
</div>

<!-- موسیقی -->
<div id="music" class="section">
    <div class="section-title"><i class="fa-solid fa-music"></i> موسیقی بازی‌ها</div>
    <div id="musicGrid" class="music-grid"></div>
</div>

<!-- شاپ -->
<div id="shop" class="section">
    <div class="hybrid-card">
        <div class="hybrid-content">

        </div>
    </div>
</div>

<!-- داستان‌ها -->
<div id="stories" class="section">
    <div class="section-title"><i class="fa-solid fa-book-open"></i> داستان‌های بازی</div>
    <div id="storiesGrid" class="cards-grid"></div>
</div>

<footer>© 2026 ZEROX | هر بازی یک حماسه</footer>

function getPlatformIcon(platform){
    if(platform==="Xbox") return '<i class="fab fa-xbox"></i>';
    if(platform==="PS") return '<i class="fab fa-playstation"></i>';
    if(platform==="PC") return '<i class="fab fa-windows"></i>';
    return '<i class="fas fa-gamepad"></i>';
}

function downloadMusic(url, title){
    fetch(url).then(r=>r.blob()).then(b=>{
        const a=document.createElement('a');
        a.href=URL.createObjectURL(b);
        a.download=title+'.mp3';
        a.click();
        URL.revokeObjectURL(a.href);
    }).catch(()=>window.open(url,'_blank'));
}

function getCatIcon(cat){
    if(cat==="ترسناک") return '<i class="fa-solid fa-ghost"></i>';
    if(cat==="هیجانی") return '<i class="fa-solid fa-bolt"></i>';
    if(cat==="علمی") return '<i class="fa-solid fa-flask"></i>';
    if(cat==="معرفی") return '<i class="fa-solid fa-gamepad"></i>';
    return '<i class="fa-solid fa-tag"></i>';
}

function renderVideos(containerId, filter="همه"){
    const container = document.getElementById(containerId);
    if(!container) return;
    let filtered = filter==="همه" ? videosData : videosData.filter(v=>v.category===filter);
    if(filtered.length===0){
        container.innerHTML = `<div style="background:white; border-radius:24px; padding:40px; text-align:center; color:var(--main);"><i class="fa-solid fa-video-slash" style="font-size:48px;"></i><h3>ویدیویی در این دسته یافت نشد</h3></div>`;
        return;
    }
    container.innerHTML = filtered.map(v=>`
        <div class="video-card">
            <img class="video-thumb" src="${v.thumb}" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
            <div class="video-badge"><i class="fa-solid fa-play"></i> تماشا</div>
            <div class="video-info">
                <h3>${v.title}</h3>
                <div class="video-meta-row">
                    <div class="video-cat-tag">${getCatIcon(v.category)} ${v.category}</div>
                    <div class="date-time"><i class="fa-regular fa-calendar"></i> ${v.date} <i class="fa-regular fa-clock"></i> ${v.time}</div>
                </div>
                <p>${v.desc.substring(0, 100)}${v.desc.length > 100 ? '...' : ''}</p>
                <div class="button-group">
                    <button class="btn-card" onclick="event.stopPropagation(); window.open('${v.link}','_blank')"><i class="fa-solid fa-play"></i> مشاهده ویدیو</button>
                    <button class="more-btn" onclick="event.stopPropagation(); toggleVideoText(this)"><i class="fa-regular fa-eye"></i> توضیحات</button>
                </div>
                <div class="full-text">${v.fullText}</div>
            </div>
        </div>
    `).join('');
}

function renderNews(containerId){
    const container = document.getElementById(containerId);
    if(!container) return;
    container.innerHTML = newsData.map(n=>`
        <div class="hybrid-card">
            <div class="hybrid-inner">
                <div class="hybrid-media"><img src="${n.image}" onerror="this.src='https://via.placeholder.com/300x200'"></div>
                <div class="hybrid-content">
                    <div class="hybrid-badge"><i class="fa-regular fa-newspaper"></i> جدیدترین خبر</div>
                    <h2>${n.title}</h2>
                    <div style="display:flex; gap:12px; margin-bottom:12px; font-size:0.7rem; color:#777;"><i class="fa-regular fa-calendar"></i> ${n.date} <i class="fa-regular fa-clock"></i> ${n.time}</div>
                    <p class="hybrid-desc">${n.summary}</p>
                    <div class="news-actions">
                        <button onclick="event.stopPropagation(); toggleNewsText(this)"><i class="fa-regular fa-eye"></i> ادامه مطلب</button>
                    </div>
                    <div class="news-full-text">${n.fullText}</div>
                </div>
            </div>
        </div>
    `).join('');
}

function renderStories(containerId){
    const container = document.getElementById(containerId);
    if(!container) return;
    container.innerHTML = storiesData.map(s=>`
        <div class="hybrid-card">
            <div class="hybrid-inner">
                <div class="hybrid-media"><img src="${s.img}" onerror="this.src='https://via.placeholder.com/300x200'"></div>
                <div class="hybrid-content">
                    <div class="hybrid-badge"><i class="fa-solid fa-book-open"></i> داستان اختصاصی</div>
                    <h2>${s.title}</h2>
                    <p class="hybrid-desc">${s.desc.substring(0, 120)}...</p>
                    <div class="news-actions">
                        <button onclick="event.stopPropagation(); toggleStoryText(this)"><i class="fa-regular fa-eye"></i> ادامه داستان</button>
                    </div>
                    <div class="news-full-text" style="white-space:pre-line; text-align:justify;">${s.full}</div>
                </div>
            </div>
        </div>
    `).join('');
}

function renderMusic(){
    const container = document.getElementById('musicGrid');
    if(!container) return;
    if(musicData.length===0){
        container.innerHTML = `<div style="background:white; border-radius:24px; padding:40px; text-align:center; color:var(--main);"><i class="fa-solid fa-music" style="font-size:48px;"></i><h3>هنوز موسیقی‌ای اضافه نشده</h3></div>`;
        return;
    }
    // برعکس کردن ترتیب برای نمایش جدیدترین اول
    const sortedMusic = [...musicData].reverse();
    container.innerHTML = sortedMusic.map(m=>`
        <div class="music-card">
            <img class="music-img" src="${m.cover}" onerror="this.src='https://via.placeholder.com/400x400?text=No+Cover'">
            <div class="music-info">
                <h3>${m.title}</h3>
                <div class="platform-badge">${getPlatformIcon(m.platform)} ${m.platform}</div>
                ${m.composers ? `
                <div class="composers-box">
                    <div class="composer-title"><i class="fa-solid fa-music"></i> آهنگسازان</div>
                    <div class="composer-names">
                        ${m.composers.map(c => `<span class="composer-name">${c}</span>`).join('')}
                    </div>
                </div>` : ''}
                <div class="music-desc">${m.desc}</div>
                <div class="custom-player">
                    <audio controls src="${m.file}"></audio>
                    <button class="download-music-btn" onclick="event.stopPropagation(); downloadMusic('${m.file}', '${m.title}')"><i class="fa-solid fa-download"></i> دانلود</button>
                </div>
            </div>
        </div>
    `).join('');
}

function toggleVideoText(btn){
    let full = btn.parentElement.nextElementSibling;
    if(full.style.display === "none" || full.style.display === ""){
        full.style.display = "block";
        btn.innerHTML = '<i class="fa-regular fa-eye-slash"></i> بستن';
    } else {
        full.style.display = "none";
        btn.innerHTML = '<i class="fa-regular fa-eye"></i> توضیحات';
    }
}

function toggleNewsText(btn){
    let full = btn.parentElement.nextElementSibling;
    if(full.style.display === "none" || full.style.display === ""){
        full.style.display = "block";
        btn.innerHTML = '<i class="fa-regular fa-eye-slash"></i> بستن متن';
    } else {
        full.style.display = "none";
        btn.innerHTML = '<i class="fa-regular fa-eye"></i> ادامه مطلب';
    }
}

function toggleStoryText(btn){
    let full = btn.parentElement.nextElementSibling;
    if(full.style.display === "none" || full.style.display === ""){
        full.style.display = "block";
        btn.innerHTML = '<i class="fa-regular fa-eye-slash"></i> بستن داستان';
    } else {
        full.style.display = "none";
        btn.innerHTML = '<i class="fa-regular fa-eye"></i> ادامه داستان';
    }
}

let currentVideoFilter = "همه";
function setupFilters(){
    document.querySelectorAll('#video .filter-btn').forEach(btn=>{
        btn.addEventListener('click',()=>{
            document.querySelectorAll('#video .filter-btn').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            currentVideoFilter = btn.getAttribute('data-filter');
            renderVideos('videosGrid', currentVideoFilter);
        });
    });
}

function showTab(id){
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if(id === 'home'){
        renderVideos('homeVideosGrid', 'همه');
        renderNews('homeNewsGrid');
        renderStories('homeStoriesGrid');
    }
    if(id === 'news'){
        renderNews('newsGrid');
    }
    if(id === 'video'){
        renderVideos('videosGrid', currentVideoFilter);
    }
    if(id === 'music'){
        renderMusic();
    }
    if(id === 'stories'){
        renderStories('storiesGrid');
    }
}

// اجرای اولیه
renderVideos('homeVideosGrid', 'همه');
renderNews('homeNewsGrid');
renderStories('homeStoriesGrid');
renderNews('newsGrid');
renderVideos('videosGrid', 'همه');
renderStories('storiesGrid');
renderMusic();
setupFilters();
</script>
