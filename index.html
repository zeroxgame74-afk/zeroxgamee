<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEROX</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

:root{
    --main:#B61C1C;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Vazirmatn', sans-serif;
    background:var(--main);
    color:white;
}

/* لوگو */
.logo{
    display:flex;
    justify-content:center;
    padding:25px 0;
}

.logo img{
    width:780px;
    max-width:90%;
}

/* منو */
nav{
    width:90%;
    margin:0 auto;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;

    padding:12px;
    border:1px solid rgba(255,255,255,0.4);
    border-radius:15px;
}

nav a{
    color:white; /* متن سفید */
    text-decoration:none;
    padding:10px 14px;
    border-radius:10px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    transition:0.3s;
}

/* آیکون‌ها قرمز */
nav a i{
    color:var(--main);
    background:white;
    padding:5px;
    border-radius:50%;
    font-size:12px;
}

/* hover */
nav a:hover{
    background:white;
    color:var(--main);
}

/* بخش‌ها */
.section{
    display:none;
    padding:20px;
}

.section.active{
    display:block;
}

/* کارت */
.card{
    background:rgba(255,255,255,0.2);
    border:1px solid white;
    border-radius:12px;
    padding:15px;
    margin-top:15px;
}

.card h2{
    color:white;
    font-weight:900;
}

/* دکمه */
button{
    background:white;
    color:var(--main);
    border:none;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    font-weight:800;
    margin-top:10px;
}

/* توضیحات */
.more{
    display:none;
    margin-top:10px;
    color:white;
    line-height:1.7;
}

/* فوتر */
footer{
    text-align:center;
    padding:15px;
    color:white;
    margin-top:20px;
    font-size:13px;
    border-top:1px solid rgba(255,255,255,0.4);
}

</style>

</head>

<body>

<div class="logo">
    <img src="https://uploadkon.ir/uploads/3ee908_26Zerox.png">
</div>

<nav>
<a onclick="showTab('home')"><i class="fa-solid fa-house"></i> خانه</a>
<a onclick="showTab('news')"><i class="fa-solid fa-gamepad"></i> اخبار</a>
<a onclick="showTab('shop')"><i class="fa-solid fa-shop"></i> شاپ</a>
<a onclick="showTab('video')"><i class="fa-solid fa-video"></i> ویدیوها</a>
<a onclick="showTab('story')"><i class="fa-solid fa-book"></i> داستان‌ها</a>
</nav>

<div id="home" class="section active">
    <h2>به ZEROX خوش اومدی 🔥</h2>
</div>

<div id="news" class="section">

    <div class="card">
        <h2>GTA VI خبر جدید</h2>
        <p>جدیدترین اطلاعات GTA 6 منتشر شد.</p>

        <button onclick="toggle(this)">توضیحات بیشتر</button>

        <div class="more">
            GTA 6 دارای بزرگ‌ترین نقشه سری GTA و AI پیشرفته‌تر است.
        </div>
    </div>

</div>

<div id="shop" class="section">
    <h2>زروکس شاپ به زودی</h2>
</div>

<div id="video" class="section">
    <h2>ویدیوها</h2>
</div>

<div id="story" class="section">
    <h2>داستان‌ها</h2>
</div>

<footer>
© 2026 ZEROX
</footer>

<script>

function showTab(id){
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function toggle(btn){
    let more = btn.nextElementSibling;
    more.style.display = more.style.display === "block" ? "none" : "block";
}

</script>

</body>
</html>
