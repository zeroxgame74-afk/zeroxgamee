<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEROX | GAME HUB</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
    --main:#B61C1C;
}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    font-family:'Vazirmatn', sans-serif;
    background:var(--main);
    color:white;
}

/* هدر - منو چسبیده به لوگو */
.header{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0px;
    padding-top:8px;
}

/* لوگو - بزرگتر و وسط */
.logo{
    text-align:center;
    width:100%;
}
.logo img{
    width:1100px;
    max-width:95%;
    display:block;
    margin:0 auto;
    margin-bottom:-5px;
}

/* منو - چسبیده به لوگو */
nav{
    width:94%;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    padding:10px 10px 12px 10px;
    border:1px solid rgba(255,255,255,0.3);
    border-radius:20px;
    background:transparent;
    margin-top:0px;
}
nav a{
    color:white;
    text-decoration:none;
    padding:8px 14px;
    border-radius:10px;
    font-weight:800;
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    transition:0.2s;
    font-size:14px;
}
nav a i{
    color:var(--main);
    background:white;
    padding:5px;
    border-radius:50%;
    font-size:12px;
}
nav a:hover{
    background:white;
    color:var(--main);
}

/* بخش‌ها */
.section{
    display:none;
    padding:20px;
}
.section.active{
    display:block;
}

/* فیلترها */
.filter-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:30px;
    justify-content:center;
}
.filter-btn{
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.3);
    padding:10px 22px;
    border-radius:50px;
    color:white;
    cursor:pointer;
    transition:0.2s;
    font-family:'Vazirmatn',sans-serif;
    font-weight:800;
    font-size:14px;
    display:inline-flex;
    align-items:center;
    gap:8px;
}
.filter-btn i{font-size:14px;}
.filter-btn:hover{
    background:var(--main);
    border-color:var(--main);
    transform:translateY(-2px);
}
.filter-btn.active{
    background:var(--main);
    border-color:var(--main);
    box-shadow:0 0 12px rgba(182,28,28,0.5);
}

/* کارت حرفه‌ای */
.hybrid-card{
    background:white;
    border-radius:24px;
    margin-top:25px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
    transition:transform 0.2s, box-shadow 0.2s;
}
.hybrid-card:hover{
    transform:translateY(-6px);
    box-shadow:0 20px 30px -8px rgba(0,0,0,0.3);
}
.hybrid-inner{
    display:flex;
    flex-direction:column;
}
@media (min-width:700px){
    .hybrid-inner{flex-direction:row;}
}
.hybrid-media{
    flex:1.2;
    background:#111;
}
.hybrid-media img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    min-height:220px;
}
.hybrid-content{
    flex:1.5;
    padding:24px;
    color:#1a1a1a;
}
.hybrid-badge{
    display:inline-block;
    background:var(--main);
    color:white;
    padding:5px 16px;
    border-radius:40px;
    font-size:12px;
    font-weight:700;
    margin-bottom:14px;
}
.hybrid-badge i{margin-left:6px;}
.hybrid-content h2{
    font-size:1.8rem;
    margin-bottom:10px;
    color:#000;
    font-weight:900;
}
.hybrid-desc{
    opacity:0.8;
    margin-bottom:18px;
    line-height:1.6;
    color:#2c2c3a;
    font-weight:500;
}
.news-actions{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:8px;
}
.news-actions button{
    background:var(--main);
    color:white;
    border:none;
    padding:9px 20px;
    border-radius:40px;
    cursor:pointer;
    font-weight:800;
    font-family:inherit;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:0.2s;
}
.news-actions button i{font-size:14px;}
.news-actions button:hover{
    background:#8e1515;
    transform:scale(0.97);
}
.news-full-text{
    display:none;
    margin-top:18px;
    padding:16px;
    background:#f5f5f5;
    border-radius:16px;
    color:#1a1a1a;
    line-height:1.8;
    font-size:14px;
    border-right:3px solid var(--main);
}

/* ========== کارت ویدیو ========== */
.videos-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:25px;
    margin-bottom:40px;
}
@media (max-width:700px){
    .videos-grid{
        grid-template-columns:1fr;
    }
}

.video-card{
    background:white;
    border-radius:24px;
    overflow:hidden;
    transition:0.3s ease;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
    position:relative;
    display:flex;
    flex-direction:column;
}
.video-card:hover{
    transform:translateY(-8px);
    box-shadow:0 20px 30px -8px rgba(0,0,0,0.3);
}
.video-thumb{
    width:100%;
    height:200px;
    object-fit:cover;
    display:block;
}
.video-badge{
    position:absolute;
    top:15px;
    right:15px;
    background:var(--main);
    color:white;
    padding:5px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:900;
    display:flex;
    align-items:center;
    gap:5px;
}
.video-info{
    padding:20px;
    text-align:center;
    flex:1;
    display:flex;
    flex-direction:column;
}
.video-info h3{
    font-size:1.3rem;
    margin-bottom:10px;
    font-weight:900;
    color:var(--main);
}
.video-meta-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:12px;
}
.video-cat-tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#f0f0f0;
    padding:4px 12px;
    border-radius:30px;
    font-size:11px;
    color:var(--main);
    font-weight:800;
}
.date-time{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:11px;
    color:#666;
    font-weight:500;
}
.date-time i{
    color:var(--main);
    font-size:11px;
}
.video-info p{
    font-size:0.85rem;
    color:#444;
    margin-bottom:15px;
    line-height:1.5;
    font-weight:500;
}
.button-group{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-top:5px;
}
.btn-card{
    background:var(--main);
    border:none;
    padding:8px 18px;
    border-radius:40px;
    color:white;
    font-weight:800;
    cursor:pointer;
    transition:0.2s;
    font-size:13px;
    font-family:'Vazirmatn',sans-serif;
    display:inline-flex;
    align-items:center;
    gap:8px;
}
.btn-card:hover{
    background:#8a1010;
    transform:scale(1.02);
}
.more-btn{
    background:transparent;
    border:1px solid var(--main);
    padding:8px 18px;
    border-radius:40px;
    color:var(--main);
    font-size:13px;
    cursor:pointer;
    font-family:'Vazirmatn',sans-serif;
    font-weight:800;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:0.2s;
}
.more-btn:hover{
    background:var(--main);
    color:white;
}
.full-text{
    display:none;
    margin-top:15px;
    padding:14px;
    background:#f5f5f5;
    border-radius:16px;
    text-align:right;
    font-size:13px;
    color:#1a1a1a;
    line-height:1.8;
    border-right:3px solid var(--main);
}

/* ========== کارت موسیقی ========== */
.music-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
    gap:30px;
    margin-bottom:40px;
}
.music-card{
    background:white;
    border-radius:28px;
    overflow:hidden;
    transition:0.3s ease;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}
.music-card:hover{
    transform:translateY(-8px);
    box-shadow:0 25px 35px -12px rgba(0,0,0,0.3);
}
.music-img{
    width:100%;
    height:210px;
    object-fit:cover;
    transition:0.3s;
}
.music-card:hover .music-img{
    transform:scale(1.02);
}
.music-info{
    padding:22px;
    text-align:center;
}
.music-info h3{
    font-size:1.5rem;
    margin-bottom:6px;
    font-weight:900;
    color:var(--main);
}
.music-game-tag{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:#f0f0f0;
    padding:6px 16px;
    border-radius:40px;
    font-size:12px;
    color:var(--main);
    font-weight:800;
    margin-bottom:15px;
}
.music-desc{
    font-size:13px;
    color:#555;
    margin:12px 0;
    line-height:1.6;
}
.custom-player{
    background:#f8f8f8;
    border-radius:60px;
    padding:10px 18px;
    margin-top:12px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
    border:1px solid #eee;
    transition:0.2s;
}
.custom-player:hover{
    border-color:var(--main);
    background:#fff;
}
.custom-player audio{
    flex:1;
    min-width:160px;
    height:40px;
    border-radius:40px;
    outline:none;
}
.download-music-btn{
    background:var(--main);
    color:white;
    border:none;
    padding:8px 18px;
    border-radius:40px;
    cursor:pointer;
    font-family:'Vazirmatn',sans-serif;
    font-weight:800;
    font-size:12px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:0.2s;
    text-decoration:none;
}
.download-music-btn:hover{
    background:#8a1010;
    transform:scale(1.03);
}

/* گرید اخبار و داستان‌ها */
.news-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
    gap:30px;
    margin-bottom:40px;
}
.cards-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
    gap:30px;
    margin-bottom:40px;
}
.section-title{
    font-size:1.8rem;
    font-weight:900;
    margin:30px 0 20px 0;
    border-right:4px solid white;
    padding-right:15px;
    display:flex;
    align-items:center;
    gap:12px;
    color:white;
}
.section-title i{
    font-size:28px;
}
footer{
    text-align:center;
    padding:15px;
    color:white;
    margin-top:40px;
    border-top:1px solid rgba(255,255,255,0.4);
    font-size:13px;
}
</style>
</head>

<body>

<div class="header">
    <div class="logo">
        <img src="https://uploadkon.ir/uploads/3ee908_26Zerox.png" alt="ZEROX">
    </div>
    <nav>
        <a onclick="showTab('home')"><i class="fa-solid fa-house"></i> خانه</a>
        <a onclick="showTab('news')"><i class="fa-solid fa-newspaper"></i> اخبار</a>
        <a onclick="showTab('video')"><i class="fa-solid fa-video"></i> ویدیوها</a>
        <a onclick="showTab('music')"><i class="fa-solid fa-music"></i> موسیقی</a>
        <a onclick="showTab('shop')"><i class="fa-solid fa-shop"></i> شاپ</a>
        <a onclick="showTab('stories')"><i class="fa-solid fa-book-open"></i> داستان‌ها</a>
    </nav>
</div>

<!-- صفحه خانه -->
<div id="home" class="section active">
    <div class="section-title"><i class="fa-solid fa-fire"></i> آخرین ویدیوها</div>
    <div id="homeVideosGrid" class="videos-grid"></div>
    
    <div class="section-title"><i class="fa-regular fa-newspaper"></i> آخرین اخبار</div>
    <div id="homeNewsGrid" class="news-grid"></div>
    
    <div class="section-title"><i class="fa-solid fa-book-open"></i> آخرین داستان‌ها</div>
    <div id="homeStoriesGrid" class="cards-grid"></div>
</div>

<!-- اخبار -->
<div id="news" class="section">
    <div class="section-title"><i class="fa-regular fa-newspaper"></i> همه اخبار</div>
    <div id="newsGrid" class="news-grid"></div>
</div>

<!-- ویدیوها -->
<div id="video" class="section">
    <div class="section-title"><i class="fa-solid fa-video"></i> ویدیوها</div>
    <div class="filter-buttons">
        <button class="filter-btn active" data-filter="همه"><i class="fa-solid fa-globe"></i> همه</button>
        <button class="filter-btn" data-filter="ترسناک"><i class="fa-solid fa-ghost"></i> ترسناک</button>
        <button class="filter-btn" data-filter="هیجانی"><i class="fa-solid fa-bolt"></i> هیجانی</button>
        <button class="filter-btn" data-filter="علمی"><i class="fa-solid fa-flask"></i> علمی‌تخیلی</button>
        <button class="filter-btn" data-filter="معرفی"><i class="fa-solid fa-gamepad"></i> معرفی بازی</button>
    </div>
    <div id="videosGrid" class="videos-grid"></div>
</div>

<!-- موسیقی -->
<div id="music" class="section">
    <div class="section-title"><i class="fa-solid fa-music"></i> موسیقی بازی‌ها</div>
    <div id="musicGrid" class="music-grid"></div>
</div>

<!-- شاپ -->
<div id="shop" class="section">
    <div class="hybrid-card">
        <div class="hybrid-content">
            <h2>🛍️ زروکس شاپ</h2>
            <p>به زودی با بهترین محصولات گیمینگ</p>
        </div>
    </div>
</div>

<!-- داستان‌ها -->
<div id="stories" class="section">
    <div class="section-title"><i class="fa-solid fa-book-open"></i> داستان‌های بازی</div>
    <div id="storiesGrid" class="cards-grid"></div>
</div>

<footer>© 2026 ZEROX | هر بازی یک حماسه</footer>

<script>
// ======================== دیتاها ========================

// ویدیوها - دو تا ویدیو
const videosData = [
    { id:1, title:"داستان کامل بازی نه من انسان نیستم | ترند و ترسناک ترین بازی در سال ۲۰۲۵", desc:"سلام بر شما | من امروز درمورد داستان بازی من انسان نیستم صحبت کردم", thumb:"https://uploadkon.ir/uploads/804c08_2671129478-9827-l-3296.jpg", link:"https://www.aparat.com/v/itl9b8h", category:"ترسناک", date:"۱۴۰۵/۰۳/۰۵", time:"۱۹:۲۰", fullText:"سلام بر شما | من امروز درمورد داستان بازی من انسان نیستم صحبت کردم | تمام نکات و همچیو توضیح دادم | امیدوارم از ویدیو لذت کافی ببرید | پارت بعدی رو به زودی زود میذارم | داستان رو تماما گفتم براتون" },
    { id:2, title:"داستان بازی اوت لست۱ | بهترین بازی ترسناک دنیا", desc:"در این ویدیو داستان کامل Outlast رو بررسی می‌کنیم | از ورود مایلز آپشور به تیمارستان مرموز Mount Massive تا روبه‌رو شدن...", thumb:"https://cdn.imgurl.ir/uploads/y799019_Zerox_th12.png", link:"https://www.aparat.com/v/gkcxc4t", category:"ترسناک", date:"۱۴۰۵/۰۳/۰۶", time:"۱۵:۳۰", fullText:"این ویدیو توسط کانال خفن زیروکس ساخته شده | در این ویدیو داستان کامل Outlast رو بررسی می‌کنیم | از ورود مایلز آپشور به تیمارستان مرموز Mount Massive تا روبه‌رو شدن با آزمایش‌های مخفی، بیماران دیوانه و موجود ترسناکی به نام Walrider. اگر به بازی‌های ترسناک و داستان‌های تاریک علاقه داری، این ویدیو رو از دست نده!" }
];

// اخبار (همون اخبار قبلی)
const newsData = [
    { id:4, title:"ولورین بالاخره پنچه هاشو کشید بیرون؟", summary:"ولورین بالاخره برگشت! اطلاعات جدیدی از Marvel's Wolverine منتشر شده", image:"https://uploadkon.ir/uploads/be1308_26InShot-20260606-132014431.jpg", date:"۱۴۰۵/۰۳/۱۸", time:"۲۲:۴۶", fullText:"ولورین بالاخره برگشت! اطلاعات جدیدی از Marvel's Wolverine منتشر شده و طرفدارها رو حسابی هیجان‌زده کرده. نمایش جدید بازی مبارزات سریع و خشن لوگان رو نشون می‌ده و به نظر می‌رسه با یکی از تاریک‌ترین بازی‌های مارول طرف باشیم." },
    { id:1, title:"GTA VI تاخیر خورد؟", summary:"طبق جدیدترین گزارش‌ها، راکستار ممکن است عرضه را به ۲۰۲۶ موکول کند.", image:"https://images.unsplash.com/photo-1612287230202-1ff1d85d1bdf", date:"۱۴۰۵/۰۳/۱۶", time:"۱۰:۳۰", fullText:"راکستار برای بهینه‌سازی بیشتر، تاریخ انتشار GTA 6 را به اوایل ۲۰۲۶ تغییر داده است." },

];

// داستان‌ها - فقط God of War Ragnarök
const storiesData = [
    { title:"داستان کامل بازی خدای جنگ رکناروگ", desc:"بعد از اتفاقات بازی قبلی، کریتوس و آترئوس توی سرزمین‌های نورس زندگی آرومی داشتن، اما این آرامش زیاد دوام نمیاره...", img:"https://cdn.imgurl.ir/uploads/n009147_god_of_war___Zerox_.jpg", full:`بعد از اتفاقات بازی قبلی، کریتوس و آترئوس توی سرزمین‌های نورس زندگی آرومی داشتن، اما این آرامش زیاد دوام نمیاره. زمستون بزرگ یا همون «فیمبول‌وینتر» شروع شده و همه می‌دونن که بعدش قراره رگناروک، یعنی پایان دنیا، از راه برسه.

اول داستان، کریتوس و آترئوس هنوز دارن با مرگ فریا و پسرش بالدور دست و پنجه نرم می‌کنن. فریا که از دست کریتوس عصبانیه، مدام دنبال انتقامه. از اون طرف آترئوس هم کم‌کم می‌فهمه که همون «لوکی» معروف افسانه‌هاست و نقش بزرگی توی آینده دنیا داره.

یه روز سر و کله ثور، خدای رعد و برق، پیدا میشه. همون جنگجوی غول‌پیکری که همه ازش می‌ترسن. اون همراه اودین میاد سراغ کریتوس. اودین سعی می‌کنه با حرف زدن جلوی جنگ رو بگیره، ولی همه می‌دونن که پشت این لبخندها یه نقشه بزرگ خوابیده.

آترئوس که دنبال جواب سوال‌هاشه، مخفیانه سفر خودش رو شروع می‌کنه. اون می‌خواد بفهمه واقعاً کیه و سرنوشتش چیه. توی این مسیر با غول‌های باقیمونده، موجودات عجیب و رازهای قدیمی روبه‌رو میشه.

در همین حال کریتوس هم درگیر این موضوعه که نکنه دوباره تبدیل به همون هیولای گذشته بشه؛ همون جنگجویی که فقط مرگ و نابودی به بار می‌آورد. اما این بار فرق کرده. حالا یه پدره و نمی‌خواد پسرش هم راه اشتباه اون رو بره.

هرچی داستان جلوتر میره، رابطه پدر و پسر بارها به چالش کشیده میشه. آترئوس می‌خواد مستقل باشه و خودش تصمیم بگیره، ولی کریتوس همیشه نگرانشه.

کم‌کم مشخص میشه که اودین سال‌ها دروغ گفته و خیلی از اتفاقات رو پشت پرده کنترل کرده. هدفش هم اینه که از سرنوشت فرار کنه و هرطور شده قدرت خودش رو حفظ کنه.

بعد از کلی ماجراجویی، متحدان مختلفی دور کریتوس جمع میشن؛ از فریا گرفته تا دورف‌ها و جنگجویان قلمروهای مختلف. همه آماده میشن تا جنگ نهایی رگناروک رو شروع کنن.

و بالاخره جنگ بزرگ آغاز میشه. ارتش‌ها به آزگارد حمله می‌کنن. نبردهای عظیم شکل می‌گیره و هر گوشه از دنیا در آتیش جنگ می‌سوزه. کریتوس با ثور روبه‌رو میشه و یکی از حماسی‌ترین مبارزه‌های تاریخ بازی‌های ویدیویی رقم می‌خوره.

اما برخلاف چیزی که همه انتظار داشتن، کریتوس سعی می‌کنه چرخه کشتار رو بشکنه. اون دیگه فقط به فکر انتقام نیست.

در نهایت ثور متوجه میشه که اودین از همه سوءاستفاده کرده، اما قبل از اینکه بتونه مسیرش رو عوض کنه، اودین خودش اون رو از بین می‌بره.

آخرین نبرد بین کریتوس و یارانش با اودین شکل می‌گیره. بعد از مبارزه‌ای سخت، اودین شکست می‌خوره و دوران حکومتش به پایان می‌رسه.

بعد از پایان جنگ، آزگارد نابود میشه و دنیا وارد دوران جدیدی میشه. آترئوس تصمیم می‌گیره برای پیدا کردن غول‌های باقی‌مونده سفر خودش رو شروع کنه. کریتوس هم برای اولین بار می‌فهمه که سرنوشتش فقط نابودی نیست؛ مردم حالا اون رو به عنوان یک قهرمان و ناجی می‌شناسن.

و اینجاست که داستان پدر و پسری که از ترس سرنوشت فرار می‌کردن، به داستان امید و ساختن آینده تبدیل میشه.` }
];

// موسیقی
const musicData = [
    { id:1, title:"تم حماسی God of War", game:"God of War Ragnarök", cover:"https://images.unsplash.com/photo-1612287230202-1ff1d85d1bdf", file:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", desc:"موسیقی حماسی کرتوس در نبرد با خدایان" }
];

function downloadMusic(url, title){
    fetch(url).then(r=>r.blob()).then(b=>{
        const a=document.createElement('a');
        a.href=URL.createObjectURL(b);
        a.download=title+'.mp3';
        a.click();
        URL.revokeObjectURL(a.href);
    }).catch(()=>window.open(url,'_blank'));
}

function getCatIcon(cat){
    if(cat==="ترسناک") return '<i class="fa-solid fa-ghost"></i>';
    if(cat==="هیجانی") return '<i class="fa-solid fa-bolt"></i>';
    if(cat==="علمی") return '<i class="fa-solid fa-flask"></i>';
    if(cat==="معرفی") return '<i class="fa-solid fa-gamepad"></i>';
    return '<i class="fa-solid fa-tag"></i>';
}

function renderVideos(containerId, filter="همه"){
    const container = document.getElementById(containerId);
    if(!container) return;
    let filtered = filter==="همه" ? videosData : videosData.filter(v=>v.category===filter);
    if(filtered.length===0){
        container.innerHTML = `<div style="background:white; border-radius:24px; padding:40px; text-align:center; color:var(--main);"><i class="fa-solid fa-video-slash" style="font-size:48px;"></i><h3>ویدیویی در این دسته یافت نشد</h3></div>`;
        return;
    }
    container.innerHTML = filtered.map(v=>`
        <div class="video-card">
            <img class="video-thumb" src="${v.thumb}" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
            <div class="video-badge"><i class="fa-solid fa-play"></i> تماشا</div>
            <div class="video-info">
                <h3>${v.title}</h3>
                <div class="video-meta-row">
                    <div class="video-cat-tag">${getCatIcon(v.category)} ${v.category}</div>
                    <div class="date-time"><i class="fa-regular fa-calendar"></i> ${v.date} <i class="fa-regular fa-clock"></i> ${v.time}</div>
                </div>
                <p>${v.desc.substring(0, 100)}${v.desc.length > 100 ? '...' : ''}</p>
                <div class="button-group">
                    <button class="btn-card" onclick="event.stopPropagation(); window.open('${v.link}','_blank')"><i class="fa-solid fa-play"></i> مشاهده ویدیو</button>
                    <button class="more-btn" onclick="event.stopPropagation(); toggleVideoText(this)"><i class="fa-regular fa-eye"></i> توضیحات</button>
                </div>
                <div class="full-text">${v.fullText}</div>
            </div>
        </div>
    `).join('');
}

function renderNews(containerId){
    const container = document.getElementById(containerId);
    if(!container) return;
    container.innerHTML = newsData.map(n=>`
        <div class="hybrid-card">
            <div class="hybrid-inner">
                <div class="hybrid-media"><img src="${n.image}" onerror="this.src='https://via.placeholder.com/300x200'"></div>
                <div class="hybrid-content">
                    <div class="hybrid-badge"><i class="fa-regular fa-newspaper"></i> جدیدترین خبر</div>
                    <h2>${n.title}</h2>
                    <div style="display:flex; gap:12px; margin-bottom:12px; font-size:0.7rem; color:#777;"><i class="fa-regular fa-calendar"></i> ${n.date} <i class="fa-regular fa-clock"></i> ${n.time}</div>
                    <p class="hybrid-desc">${n.summary}</p>
                    <div class="news-actions">
                        <button onclick="event.stopPropagation(); toggleNewsText(this)"><i class="fa-regular fa-eye"></i> ادامه مطلب</button>
                    </div>
                    <div class="news-full-text">${n.fullText}</div>
                </div>
            </div>
        </div>
    `).join('');
}

function renderStories(containerId){
    const container = document.getElementById(containerId);
    if(!container) return;
    container.innerHTML = storiesData.map(s=>`
        <div class="hybrid-card">
            <div class="hybrid-inner">
                <div class="hybrid-media"><img src="${s.img}" onerror="this.src='https://via.placeholder.com/300x200'"></div>
                <div class="hybrid-content">
                    <div class="hybrid-badge"><i class="fa-solid fa-book-open"></i> داستان اختصاصی</div>
                    <h2>${s.title}</h2>
                    <p class="hybrid-desc">${s.desc.substring(0, 120)}...</p>
                    <div class="news-actions">
                        <button onclick="event.stopPropagation(); toggleStoryText(this)"><i class="fa-regular fa-eye"></i> ادامه داستان</button>
                    </div>
                    <div class="news-full-text" style="white-space:pre-line; text-align:justify;">${s.full}</div>
                </div>
            </div>
        </div>
    `).join('');
}

function renderMusic(){
    const container = document.getElementById('musicGrid');
    if(!container) return;
    if(musicData.length===0){
        container.innerHTML = `<div style="background:white; border-radius:24px; padding:40px; text-align:center; color:var(--main);"><i class="fa-solid fa-music" style="font-size:48px;"></i><h3>هنوز موسیقی‌ای اضافه نشده</h3></div>`;
        return;
    }
    container.innerHTML = musicData.map(m=>`
        <div class="music-card">
            <img class="music-img" src="${m.cover}" onerror="this.src='https://via.placeholder.com/340x210?text=No+Cover'">
            <div class="music-info">
                <h3>${m.title}</h3>
                <div class="music-game-tag"><i class="fa-solid fa-gamepad"></i> ${m.game}</div>
                <div class="music-desc">${m.desc}</div>
                <div class="custom-player">
                    <audio controls src="${m.file}"></audio>
                    <button class="download-music-btn" onclick="event.stopPropagation(); downloadMusic('${m.file}', '${m.title}')"><i class="fa-solid fa-download"></i> دانلود</button>
                </div>
            </div>
        </div>
    `).join('');
}

function toggleVideoText(btn){
    let full = btn.parentElement.nextElementSibling;
    if(full.style.display === "none" || full.style.display === ""){
        full.style.display = "block";
        btn.innerHTML = '<i class="fa-regular fa-eye-slash"></i> بستن';
    } else {
        full.style.display = "none";
        btn.innerHTML = '<i class="fa-regular fa-eye"></i> توضیحات';
    }
}

function toggleNewsText(btn){
    let full = btn.parentElement.nextElementSibling;
    if(full.style.display === "none" || full.style.display === ""){
        full.style.display = "block";
        btn.innerHTML = '<i class="fa-regular fa-eye-slash"></i> بستن متن';
    } else {
        full.style.display = "none";
        btn.innerHTML = '<i class="fa-regular fa-eye"></i> ادامه مطلب';
    }
}

function toggleStoryText(btn){
    let full = btn.parentElement.nextElementSibling;
    if(full.style.display === "none" || full.style.display === ""){
        full.style.display = "block";
        btn.innerHTML = '<i class="fa-regular fa-eye-slash"></i> بستن داستان';
    } else {
        full.style.display = "none";
        btn.innerHTML = '<i class="fa-regular fa-eye"></i> ادامه داستان';
    }
}

let currentVideoFilter = "همه";
function setupFilters(){
    document.querySelectorAll('#video .filter-btn').forEach(btn=>{
        btn.addEventListener('click',()=>{
            document.querySelectorAll('#video .filter-btn').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            currentVideoFilter = btn.getAttribute('data-filter');
            renderVideos('videosGrid', currentVideoFilter);
        });
    });
}

function showTab(id){
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if(id === 'home'){
        renderVideos('homeVideosGrid', 'همه');
        renderNews('homeNewsGrid');
        renderStories('homeStoriesGrid');
    }
    if(id === 'news'){
        renderNews('newsGrid');
    }
    if(id === 'video'){
        renderVideos('videosGrid', currentVideoFilter);
    }
    if(id === 'music'){
        renderMusic();
    }
    if(id === 'stories'){
        renderStories('storiesGrid');
    }
}

// اجرای اولیه
renderVideos('homeVideosGrid', 'همه');
renderNews('homeNewsGrid');
renderStories('homeStoriesGrid');
renderNews('newsGrid');
renderVideos('videosGrid', 'همه');
renderStories('storiesGrid');
renderMusic();
setupFilters();
</script>
