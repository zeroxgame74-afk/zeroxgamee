<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEROX.GAME.IR</title>

:root{
    --main:#B61C1C;
}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    font-family:'Vazirmatn', sans-serif;
    background:var(--main);
    color:white;
}
.header{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0px;
    padding-top:8px;
}
.logo{
    text-align:center;
    width:100%;
}
.logo img{
    width:1500px;
    max-width:95%;
    display:block;
    margin:0 auto;
    margin-bottom:-5px;
}
nav{
    width:94%;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    padding:10px 10px 12px 10px;
    border:1px solid rgba(255,255,255,0.3);
    border-radius:20px;
    background:transparent;
    margin-top:0px;
}
nav a{
    color:white;
    text-decoration:none;
    padding:8px 14px;
    border-radius:10px;
    font-weight:800;
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    transition:0.2s;
    font-size:14px;
}
nav a i{
    color:var(--main);
    background:white;
    padding:5px;
    border-radius:50%;
    font-size:12px;
}
nav a:hover{
    background:white;
    color:var(--main);
}
.section{
    display:none;
    padding:20px;
}
.section.active{
    display:block;
}
.filter-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:30px;
    justify-content:center;
}
.filter-btn{
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.3);
    padding:10px 22px;
    border-radius:50px;
    color:white;
    cursor:pointer;
    transition:0.2s;
    font-family:'Vazirmatn',sans-serif;
    font-weight:800;
    font-size:14px;
    display:inline-flex;
    align-items:center;
    gap:8px;
}
.filter-btn i{font-size:14px;}
.filter-btn:hover{
    background:var(--main);
    border-color:var(--main);
    transform:translateY(-2px);
}
.filter-btn.active{
    background:var(--main);
    border-color:var(--main);
    box-shadow:0 0 12px rgba(182,28,28,0.5);
}
